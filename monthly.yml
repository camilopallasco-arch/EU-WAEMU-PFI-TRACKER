name: Monthly update

on:
  schedule:
    - cron: "0 5 1 * *"      # 05:00 UTC on the 1st of every month
  workflow_dispatch:          # adds a "Run workflow" button in the Actions tab
  push:
    branches: [main]          # also republish whenever you edit files

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch every source, normalise, rebuild the site
        run: python run_all.py
      - name: Save updated data to the repository
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add data site/index.html raw
          git diff --cached --quiet || git commit -m "Monthly data update $(date +%Y-%m-%d)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
